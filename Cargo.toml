[workspace]
resolver = "3"
members = [
    "crates/clockin-core",
    "crates/clockin-sync",
    "src-tauri",
    "plugins/clockin-alarm",
    "tools/gen-sounds",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
clockin-core = { path = "crates/clockin-core" }
clockin-sync = { path = "crates/clockin-sync" }
tauri-plugin-clockin-alarm = { path = "plugins/clockin-alarm" }
# Always bundle the IANA tz database so Europe/Athens behaves the same on
# Windows, Android and Linux (Windows and Android have no usable /usr/share/zoneinfo).
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin = { version = "2.7", features = [] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
