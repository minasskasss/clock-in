name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (fmt, clippy, tests, frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      # Installs exactly the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Show Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build (Tauri embeds dist/ at compile time)
        run: pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  windows:
    name: Windows (clippy, tests, debug build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs exactly the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Show Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Frontend build (Tauri embeds dist/ at compile time)
        run: pnpm build

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

      - name: Tauri debug build (NSIS installer)
        run: pnpm tauri build --debug

      - name: Upload debug installer
        uses: actions/upload-artifact@v7
        with:
          name: clock-in-debug-installer
          path: target/debug/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android (clippy, debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, components and Android targets pinned in rust-toolchain.toml.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform 37 and the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend build (Tauri embeds dist/ at compile time)
        run: pnpm build

      # The Android-only Rust code (src-tauri/src/android.rs, the plugin's mobile.rs).
      - name: cargo clippy (Android)
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$BIN/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          cargo clippy -p clock-in -p tauri-plugin-clockin-alarm --target aarch64-linux-android --all-targets -- -D warnings

      # Compiles the Kotlin plugin and packages a debug APK (no server config in CI).
      - name: Tauri Android debug build (arm64 APK)
        run: pnpm tauri android build --debug --target aarch64 --apk
