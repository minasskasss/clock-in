[package]
name = "clock-in"
description = "Clock In: clock-in / clock-out reminders for the shop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "clock-in"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "clockin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
clockin-core.workspace = true
clockin-sync.workspace = true
tauri-plugin-clockin-alarm.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
uuid = { version = "1.27.0", features = ["serde", "v4"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
getrandom = "0.3.4"
thiserror = "2.0.21"

# Windows Credential Manager for the device secret and the local database key.
[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# Title-bar and taskbar icons at their exact sizes (src/window_icon.rs).
windows-sys = { version = "0.61", features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
