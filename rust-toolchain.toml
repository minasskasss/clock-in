# Pins the Rust toolchain for local builds (Linux cloud VM, Windows laptop)
# and every CI job. No host triple: each machine uses its own host, so
# Windows keeps the MSVC toolchain. The Android targets are for the phone app
# (Phase 5). Bump deliberately, then log it in docs/DECISIONS.md.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
targets = ["aarch64-linux-android", "armv7-linux-androideabi", "i686-linux-android", "x86_64-linux-android"]
profile = "minimal"
